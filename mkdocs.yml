site_name: FluxRules
site_description: Python rule evaluation toolkit with optional API, powered by the PHREAK engine
site_url: https://saurabh2mishra.github.io/fluxrules/
repo_url: https://github.com/saurabh2mishra/fluxrules
repo_name: saurabh2mishra/fluxrules

docs_dir: docs

# Fail the strict build on any link to a missing page or missing section.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/saurabh2mishra/fluxrules

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          show_source: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quickstart: quickstart.md
    - Concepts: concepts.md
    - From Fact to Action: fact-to-action.md
    - Decision Guide: decision-guide.md
    - Architecture: architecture.md
  - Using FluxRules:
    - Ways to Evaluate a Fact: evaluating-facts.md
