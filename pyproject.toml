[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "fluxrules"
version = "0.0.1"
description = "Backend-first rules engine library with optional API adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FluxRules Contributors" }]
# The core import chain (fluxrules.domain.unified_rule) requires pydantic.
# SQLAlchemy is NOT required at core import - it is lazily loaded by the
# optional persistence/prefilter paths (see the `sql` extra).
dependencies = ["pydantic>=2.8"]

[project.scripts]
fluxrules = "fluxrules.cli.main:app"

[project.optional-dependencies]
# fastapi is capped below 0.116: FastAPI 0.116+ pulls Starlette >=1.0, whose
# APIRouter.include_router defers to lazy `_IncludedRouter` objects (path=None)
# instead of eagerly flattening APIRoutes. That breaks route introspection in
# `create_app()` (75 routes collapse to 5) and the route-registration tests.
# Revisit once the app is made Starlette-1.x compatible.
api = ["fastapi>=0.115,<0.116", "uvicorn>=0.30", "pydantic>=2.8", "python-multipart>=0.0.20", "python-jose[cryptography]>=3.3.0", "bcrypt>=4.0", "email-validator>=2.0"]
sql = ["sqlalchemy>=2.0", "alembic>=1.13"]
redis = ["redis>=5.0"]
otel = ["opentelemetry-api>=1.26", "opentelemetry-sdk>=1.26"]
yaml = ["pyyaml>=6.0"]
cli = ["typer>=0.12", "click>=8.0", "rich>=13.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.4", "mkdocstrings[python]>=0.24"]
all = ["fastapi>=0.115,<0.116", "uvicorn>=0.30", "pydantic>=2.8", "python-multipart>=0.0.20", "python-jose[cryptography]>=3.3.0", "bcrypt>=4.0", "email-validator>=2.0", "sqlalchemy>=2.0", "alembic>=1.13", "redis>=5.0", "opentelemetry-api>=1.26", "opentelemetry-sdk>=1.26", "pyyaml>=6.0", "typer>=0.12", "click>=8.0", "rich>=13.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=4.0", "pytest-xdist>=3.6", "hypothesis>=6.100", "httpx>=0.27", "ruff==0.16.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "sqlalchemy>=2.0", "alembic>=1.13", "redis>=5.0", "fastapi>=0.115,<0.116", "uvicorn>=0.30", "pydantic>=2.8", "python-jose[cryptography]>=3.3.0", "pyyaml>=6.0", "bcrypt>=4.0", "email-validator>=2.0", "mkdocs>=1.5", "mkdocs-material>=9.4", "mkdocstrings[python]>=0.24", "typer>=0.12", "click>=8.0", "rich>=13.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/fluxrules"]

[tool.ruff]
# Explicit, version-stable configuration so `ruff check src/ tests/` is
# reproducible across contributors and CI (see the pinned `ruff==` in `dev`).
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Curated, meaningful core rule set (pyflakes, pycodestyle, import order,
# pyupgrade, bugbear, comprehensions). Opinionated or intentionally-used
# patterns are listed in `ignore` with a rationale rather than left implicit.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade (modern typing/syntax)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    # flake8-bandit: a scoped, security-relevant subset (injection, unsafe
    # deserialization, dynamic exec, weak hashing, swallowed exceptions).
    # Noisy/low-signal S rules (asserts, non-crypto random) are deliberately
    # excluded rather than blanket-ignored.
    "S102", # exec-builtin
    "S104", # hardcoded bind-all-interfaces
    "S105", # hardcoded password/secret string
    "S110", # try-except-pass
    "S112", # try-except-continue
    "S301", # pickle / unsafe deserialization
    "S302", # marshal / unsafe deserialization
    "S307", # eval
    "S324", # insecure hash function
    "S608", # hardcoded SQL expression / injection
]
ignore = [
    "E501",   # line length is governed by the formatter
    "B008",   # function call in argument default (FastAPI `Depends()` pattern)
    "B023",   # function-uses-loop-variable (reviewed call sites)
    "B904",   # raise-without-from-inside-except (project style)
    "B905",   # zip-without-explicit-strict (py3.10 baseline)
    "B007",   # unused loop control variable (kept for readability)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B017",   # broad pytest.raises used intentionally
    "B018",   # bare expressions asserted in tests
    "S",      # bandit rules are for product code, not test fixtures/asserts
]

[tool.ruff.lint.isort]
known-first-party = ["fluxrules"]

[tool.bandit]
# bandit complements ruff's flake8-bandit (S) rules in CI. Product code only;
# the skipped IDs are the low-severity/false-positive classes already reviewed
# and justified inline for ruff (see the matching `# noqa: S*` comments), so
# bandit still gates the genuinely dangerous checks (exec/eval/pickle/yaml.load/
# subprocess-shell/requests-verify=False, etc.).
exclude_dirs = ["tests", "alembic", "examples", "site", "benchmarks"]
skips = [
    "B101",  # assert (product code uses asserts for invariants)
    "B104",  # bind all interfaces (servers do this by design)
    "B105",  # hardcoded placeholder secret (overridden via env)
    "B110",  # try-except-pass (best-effort telemetry/cache paths)
    "B112",  # try-except-continue (skip-and-continue validators)
    "B303",  # md5 used as a non-security content fingerprint
    "B324",  # hashlib insecure hash (usedforsecurity=False / fingerprints)
    "B608",  # SQL built from an internal table-name constant, not user input
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "performance: marks tests as performance/benchmark tests (deselect with '-m \"not performance\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "security: marks tests as security tests",
]

[tool.coverage.run]
source = ["src/fluxrules"]
branch = true
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "class .*\\(Protocol\\):",
]
precision = 2

[dependency-groups]
dev = [
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.27",
]

[tool.uv]
# The committed uv.lock uses lockfile revision 2, which is read only by uv
# >= 0.8. Declaring the floor turns an older uv's cryptic "registry
# distribution without a valid URL" error into a clear, actionable message.
required-version = ">=0.8"
