name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"          # API reference regenerates on source changes
      - ".github/workflows/docs.yml"
  workflow_dispatch:      # allow manual deploys from the Actions tab

permissions:
  contents: write         # mkdocs gh-deploy pushes to the gh-pages branch

jobs:
  deploy:
    name: Build and deploy MkDocs site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git-revision-date plugins work

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: ">=0.8"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with docs extras
        run: uv sync --extra docs

      - name: Configure git for gh-deploy
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy to gh-pages branch
        run: uv run mkdocs gh-deploy --force --clean --verbose
