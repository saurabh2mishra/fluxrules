name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: ">=0.8"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: uv sync --extra dev --extra docs

      - name: Ruff
        run: uv run ruff check src/ tests/

      - name: Mypy
        run: uv run mypy src/fluxrules --ignore-missing-imports

      - name: Non-performance test suite
        run: uv run pytest tests/ -q -m "not performance"

      - name: Docs snippet tests
        run: uv run pytest tests/docs/test_doc_snippets.py -q

      - name: MkDocs build
        run: uv run mkdocs build

      - name: Bandit security scan
        run: uv run bandit -r src/fluxrules -c pyproject.toml

      - name: Dependency audit
        run: uv run pip-audit --skip-editable

      - name: Fresh API-extra dependency audit
        run: |
          set -euo pipefail
          api_env="$(mktemp -d)/venv"
          uv venv --python "${{ matrix.python-version }}" "$api_env"
          uv pip install --python "$api_env/bin/python" '.[api]'
          api_site_packages="$("$api_env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          uv run --no-sync pip-audit --path "$api_site_packages"
