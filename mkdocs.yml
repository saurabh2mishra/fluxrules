site_name: FluxRules
site_description: Python rule evaluation toolkit with optional API, powered by the PHREAK engine
site_url: https://fluxrules.github.io/fluxrules/
repo_url: https://github.com/fluxrules/fluxrules
repo_name: fluxrules

docs_dir: docs

theme:
  name: material

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fluxrules/fluxrules

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          show_source: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Features: features.md
  - Architecture: architecture.md
