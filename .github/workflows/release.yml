name: Release

# Triggers only on version tags — never on branch pushes.
# Pushing v0.1.0 starts build → smoke-test → (manual gate) → PyPI.
on:
  push:
    tags:
      - "v*"

# No top-level permissions: every job declares its own minimal set.
permissions: {}

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read   # checkout only

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for SCM-based version tools

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: ">=0.8"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reject runs triggered by a tag that is not reachable from main.
      # This prevents a tag pushed from a feature branch from publishing.
      - name: Assert tag commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=50
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME was pushed from a commit not on main."
            echo "Only tags on main may trigger a release."
            exit 1
          fi
          echo "tag-on-main-gate: $GITHUB_SHA is reachable from origin/main OK"

      - name: Build sdist and wheel
        run: uv build

      # Verify the tag version matches pyproject.toml before uploading anything.
      - name: Assert tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"           # e.g. "v0.1.0"
          PKG_VERSION="$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag '$TAG' does not match pyproject.toml version 'v${PKG_VERSION}'."
            echo "Update pyproject.toml and src/fluxrules/version.py, then re-tag."
            exit 1
          fi
          echo "tag-version-gate: $TAG == v$PKG_VERSION OK"

      # Verify both version fields are in sync.
      - name: Assert pyproject.toml and version.py agree
        shell: bash
        run: |
          set -euo pipefail
          PY_VERSION="$(python3 -c "
          import sys; sys.path.insert(0,'src')
          from fluxrules.version import __version__; print(__version__)
          ")"
          PKG_VERSION="$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")"
          if [ "$PY_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::src/fluxrules/version.py (__version__='$PY_VERSION') differs from pyproject.toml ('$PKG_VERSION')."
            exit 1
          fi
          echo "version-sync-gate: $PY_VERSION OK"

      - name: twine check
        run: |
          uv tool install twine
          uv tool run twine check dist/* --strict

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── 2. Install smoke test (sdist + wheel, 3 Python versions) ─────────────
  smoke-test:
    name: Install smoke (${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke-test each artifact
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz dist/*.whl; do
            venv_dir="$(mktemp -d)/smoke-venv"
            python -m venv "$venv_dir"
            . "$venv_dir/bin/activate"
            pip install --upgrade pip --quiet
            pip install --force-reinstall "$artifact" --quiet
            python scripts/artifact_smoke_test.py
            deactivate
            rm -rf "$venv_dir"
          done

  # ── 3. Publish to PyPI ───────────────────────────────────────────────────
  #
  # TestPyPI skipped: name is unavailable on test.pypi.org.
  # Validation is covered by build gates + smoke-test on 3 Python versions.
  #
  # Requires secret PYPI_API_TOKEN set at:
  #   https://github.com/saurabh2mishra/fluxrules/settings/secrets/actions
  #
  # The pypi GitHub environment gate gives a manual confirmation click
  # before the upload proceeds. Set up at:
  #   https://github.com/saurabh2mishra/fluxrules/settings/environments
  #
  publish-pypi:
    name: Publish → PyPI
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fluxrules
    permissions:
      contents: write   # create GitHub release

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
          verbose: true

      # Create a GitHub release automatically on successful PyPI publish.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
